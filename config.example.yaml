# =============================================================================
#  The Linux Bot - configurazione di esempio
#  Copia questo file in config.yaml e adattalo. Valida con:
#      python -m linuxbot -c config.yaml --check
#
#  Le password possono venire dall'ambiente: ${NOME_VARIABILE} oppure
#  ${NOME_VARIABILE:-valore_di_default}.
#
#  Nei testi puoi usare queste variabili:
#    {nick} {user} {host} {mask}   chi ha scritto / è entrato
#    {channel} {botnick} {server}  canale, nick del bot, server
#    {date} {time} {weekday}       data e ora correnti
#    {users}                       utenti nel canale
#    {prefix}                      primo prefisso dei comandi (es. "!")
#    {args} {arg1}..{arg9} {rest}  argomenti del comando ({rest} = dal 2° in poi)
#    {rest2}                       argomenti dal 3° in poi
#    {target}                      {arg1} se presente, altrimenti {nick}
#    {argc}                        numero di argomenti
#    {match} {group1}.. {nome}     testo trovato dalle risposte regex
#    + tutte le chiavi della sezione "variables"
#  Per scrivere una graffa letterale usa {{ e }}.
#  Dove è ammesso un testo puoi mettere una lista: ne verrà scelto uno a caso.
# =============================================================================

server:
  host: irc.example.org
  port: 6697
  tls: true
  tls_verify: true          # metti false solo per certificati self-signed
  password: null            # password del server (comando PASS), se serve
  encoding: utf-8

identity:
  nick: TheLinuxBot
  alt_nicks: [TheLinuxBot_, TheLinuxBot__]
  username: linuxbot
  realname: "The Linux Bot"
  version: "The Linux Bot - https://github.com/the-linux-nerd/the-linux-bot"

# -----------------------------------------------------------------------------
# Autenticazione. Puoi abilitare uno o più metodi insieme.
# -----------------------------------------------------------------------------
auth:
  # Non serve sapere se il server usa Anope o Atheme: il bot lo scopre da solo.
  # 1) Se il server offre SASL, si identifica lì (con la password di NickServ)
  #    già durante la connessione: funziona anche se ha dovuto usare un nick alternativo.
  # 2) Altrimenti manda a NickServ "IDENTIFY <account> <password>".
  # 3) Chiede la versione a NickServ per riconoscere Anope o Atheme e, se il nick
  #    principale era occupato, se lo riprende (REGAIN su Atheme, RECOVER su Anope;
  #    con services sconosciuti prova REGAIN, RECOVER e GHOST). Se poi il nick si
  #    libera (chi lo usava esce), lo riprende subito.
  sasl:
    enabled: auto            # auto | true | false
    username: TheLinuxBot    # account; default: nickserv.account o identity.nick
    password: ${LINUXBOT_SASL_PASSWORD:-}   # vuota = usa quella di NickServ

  nickserv:
    enabled: true
    service: NickServ
    account: TheLinuxBot     # account registrato (default: identity.nick)
    password: ${LINUXBOT_NICKSERV_PASSWORD:-cambiami}
    command: auto            # oppure un testo, es. "IDENTIFY {account} {password}"
    services: auto           # auto | anope | atheme | other
    regain: true             # riprendersi il nick principale se è occupato
    # regain_commands: ["GHOST {nick} {password}"]   # per services particolari
    # Il bot entra nei canali solo dopo la conferma (e dopo aver ripreso il nick),
    # così ChanServ lo riconosce subito e gli dà l'op. "wait" è l'attesa massima.
    wait_for_login: true
    wait: 15
    # Frasi (regex) con cui i services confermano o rifiutano l'identificazione.
    # I valori predefiniti coprono Anope e Atheme in inglese e italiano.
    # success_pattern: "(?i)you are now identified|password accepted"
    # failure_pattern: "(?i)invalid password"

  # IRC operator (comando OPER): richiede un blocco oper nel server (ircd.conf).
  oper:
    enabled: true
    name: linuxbot
    password: ${LINUXBOT_OPER_PASSWORD:-cambiami}

  user_modes: "+B"                   # modi utente da impostare dopo il login (+B = bot)

channels:
  - name: "#linux"
    # Owner del canale: immuni a ban, kickban e kick del bot (anche con maschere
    # larghe come *!*@*.it), e se un op li banna a mano il bot toglie il ban.
    # Meglio usare maschere sull'host (o sul cloak dei services) che sul solo nick,
    # perché un nick lo può prendere chiunque.
    owners:
      - "*!*@the-linux-nerd.example.org"
      - "*!*@user/fabio"              # cloak dei services
  - name: "#linux-staff"
    key: ${LINUXBOT_STAFF_KEY:-segreto}
    owners: ["*!*@the-linux-nerd.example.org"]

# Maschere nick!user@host degli amministratori del bot (permesso "admin").
admins:
  - "*!*@the-linux-nerd.example.org"
  - "fabio!*@*"

behavior:
  command_prefixes: ["!", "."]
  answer_when_addressed: true        # "TheLinuxBot: help" equivale a "!help"
  respond_to_private: true           # risponde anche in query privata
  ignore:                            # utenti ignorati completamente
    - "*!*@*.spammer.example"
    - "*bot*!*@*"
  rejoin_on_kick: true
  rejoin_delay: 5
  reconnect_delay: 10                # raddoppia ad ogni tentativo fallito...
  reconnect_max_delay: 300           # ...fino a questo massimo
  flood_burst: 4                     # messaggi inviabili subito
  flood_rate: 1.0                    # poi uno ogni N secondi
  max_line_bytes: 400                # i messaggi più lunghi vengono spezzati
  unknown_command_reply: null        # es. "{nick}: comando sconosciuto, prova {prefix}help"
  permission_denied_reply: "{nick}: non hai i permessi per usare {command}."
  cooldown_reply: null               # es. "Calma {nick}, riprova fra poco."
  timezone: Europe/Rome              # per le attività programmate, {date} e {time}

# Variabili personalizzate utilizzabili in tutti i testi.
variables:
  site: "https://the-linux-nerd.example.org"
  rules_url: "https://the-linux-nerd.example.org/regole"
  pastebin: "https://paste.debian.net"

# -----------------------------------------------------------------------------
# Il bot spiega sé stesso: "TheLinuxBot: chi sei?", "come si usa seen?", !info ...
# L'elenco di cosa sa fare viene costruito dalla configurazione (solo le funzioni
# attive). Le spiegazioni dei comandi usano description, details ed examples.
# -----------------------------------------------------------------------------
about:
  intro:
    - "Ciao {nick}! Sono {botnick}, il bot della community The Linux Nerd{in_channel}."
    - "Mi gestisce lo staff: per problemi con me scrivete in #linux-staff."
  auto_features: true      # aggiunge "Ecco cosa so fare" con le funzioni attive
  method: private          # spiegazioni lunghe in query (private), notice o nel canale (say)
  inline_max_lines: 2      # le risposte brevi restano dove è stata fatta la domanda
  # Argomenti personalizzati ("TheLinuxBot: spiegami le regole", "!info regole").
  # Sostituiscono quelli automatici con lo stesso nome (saluti, memoria, messaggi,
  # domande, moderazione).
  topics:
    regole:
      aliases: [regolamento, rules]
      text:
        - "Le regole in breve: rispetto per tutti, niente spam, niente flood, i log lunghi vanno su {pastebin}."
        - "Il regolamento completo è qui: {rules_url}"
  # texts: { redirect: "{nick}: ti ho risposto in privato." }

# -----------------------------------------------------------------------------
# Ricerca di risposte tecniche: !cerca, "?? domanda", "TheLinuxBot: come faccio a ...?"
# Usa l'API pubblica di Stack Exchange (senza chiave: ~300 richieste al giorno per
# IP; con una chiave gratuita da https://stackapps.com 10000) e l'API di MediaWiki.
# Ogni ricerca interroga tutti i provider in parallelo (una richiesta per sito).
# Il bot deve poter raggiungere api.stackexchange.com e wiki.archlinux.org.
# -----------------------------------------------------------------------------
search:
  enabled: true
  timeout: 8                 # secondi per provider
  cache_minutes: 60          # la stessa domanda non viene ripetuta all'API per un'ora
  max_results: 4             # risultati mostrati, a turno fra i provider
  only_answered: true        # solo domande con almeno una risposta
  stackexchange_key: ${STACKEXCHANGE_KEY:-}
  providers:
    # L'ordine conta: i risultati vengono presi a turno, un provider dopo l'altro.
    - { name: so-it,     type: stackexchange, site: it.stackoverflow, label: "SO-it" }
    - { name: unix,      type: stackexchange, site: unix,             label: "unix.SE" }
    - { name: archwiki,  type: mediawiki, api: "https://wiki.archlinux.org/api.php", label: "ArchWiki" }
    # Video da canali YouTube tecnici (handle @nome o ID del canale UC...).
    # Con una chiave YouTube Data API v3 (gratuita, da https://console.cloud.google.com,
    # abilitando "YouTube Data API v3") cerca fra tutti i video del canale: ogni
    # ricerca costa 100 delle 10000 unità giornaliere, per ogni canale.
    # Senza chiave legge il feed pubblico del canale: solo gli ultimi 15 video, e
    # servono gli ID UC... (l'ID si trova nella pagina "Informazioni" del canale,
    # "Condividi canale" -> "Copia ID canale").
    - name: youtube
      type: youtube
      label: "YouTube"
      api_key: ${YOUTUBE_API_KEY:-}
      order: relevance           # relevance | date (i più recenti)
      channels:
        - "@the-linux-nerd"
        # - "UCxxxxxxxxxxxxxxxxxxxxxx"   # altri canali, anche per ID
    - { name: so,        type: stackexchange, site: stackoverflow,    label: "SO" }
    - { name: askubuntu, type: stackexchange, site: askubuntu,        label: "AskUbuntu" }
  # texts: { result: "[{label}] {title} {meta}{link}" }

# -----------------------------------------------------------------------------
# Karma: "mario++" / "mario--" (o "grazie mario") nei canali, punteggi permanenti
# nel database, !karma, !top. Un ban (messo dal bot o a mano) azzera il karma.
# -----------------------------------------------------------------------------
karma:
  enabled: true
  scope: channel             # channel = classifica per canale | global = una sola
  channels: ["#linux"]       # vuoto = tutti i canali
  plusplus: true
  allow_negative: true       # permette nick--
  require_present: true      # solo per chi è nel canale: così "c++" e "g++" non contano
  ignore_words: [c, g, i, j, k, n, x, y, notepad]
  max_per_message: 3
  cooldown: 3600             # stesso donatore -> stesso destinatario: una volta all'ora
  daily_limit: 20            # punti che ognuno può dare in 24 ore
  reset_on_ban: true         # il ban azzera il karma (anche ban a tempo e ban a mano)
  announce: true             # "mario ha ora 12 punti karma (+1 da anna)"
  announce_reset: false
  top_size: 10

# -----------------------------------------------------------------------------
# Attività programmate: azioni a orari fissi (at: "HH:MM", anche più d'uno, con
# days per limitarle ad alcuni giorni) oppure a intervalli (every: 30m, 2h, 1d).
# Gli orari seguono behavior.timezone. Si provano subito con !esegui <nome>.
# L'ultima esecuzione è salvata nel database: un riavvio non le ripete, e con
# catch_up un'attività saltata (PC spento all'orario previsto) viene eseguita
# appena il bot riparte, se non è passato più di quel tempo. {late} nei testi
# diventa " (prevista alle 00:00)" quando è in ritardo, altrimenti è vuoto.
# -----------------------------------------------------------------------------
schedules:
  - name: karma-mezzanotte
    at: "00:00"
    catch_up: 12h            # PC spento a mezzanotte? la pubblica appena riparte, entro le 12:00
    channels: ["#linux"]
    actions:
      - karma_top:
          size: 10
          skip_empty: true       # se nessuno ha karma, non scrive niente
          text: "🏆 Top ten del karma{where}{late}: {list}. Grazie a tutti per l'aiuto! nick++ per ringraziare."

  # Copia di sicurezza del database (karma, ban, memoria) ogni notte, tenendo le
  # ultime 14. Se il PC è spento alle 4, la fa appena si riaccende (entro un giorno).
  - name: backup-database
    at: "04:00"
    catch_up: 1d
    per_channel: false       # una volta sola, non per ogni canale
    actions:
      - db_backup: { directory: backups, keep: 14 }

  # Altri esempi (decommenta per usarli):
  # - name: regole-settimanali
  #   at: "21:00"
  #   days: [ven]
  #   channels: ["#linux"]
  #   actions:
  #     - say: "Promemoria: le regole del canale sono qui {rules_url}. Buon weekend!"
  # - name: consiglio
  #   every: 6h
  #   actions:
  #     - say:
  #         - "💡 Lo sapevi? Ctrl+R nella shell cerca nella cronologia dei comandi."
  #         - "💡 Lo sapevi? 'sudo !!' ripete l'ultimo comando con sudo."
  #         - "💡 Lo sapevi? 'cd -' torna alla cartella precedente."

# -----------------------------------------------------------------------------
# Op per il bot: appena entra in un canale controlla di essere op e, se no, lo
# chiede a ChanServ; riprova se non arriva e lo richiede se glielo tolgono.
# Sui services il bot deve avere l'auto-op nel canale, ad esempio:
#   Anope:   /msg ChanServ AOP #linux ADD TheLinuxBot
#   Atheme:  /msg ChanServ FLAGS #linux TheLinuxBot +Oo
# -----------------------------------------------------------------------------
self_op:
  enabled: true
  method: auto             # chanserv | samode | auto (SAMODE se il bot è IRC operator)
  service: ChanServ
  command: "OP {channel} {botnick}"
  samode: "SAMODE {channel} +o {botnick}"
  delay: 2                 # secondi dopo l'ingresso: spesso ChanServ dà l'op da solo
  retry: 30                # attesa fra un tentativo e l'altro
  max_retries: 3
  on_deop: true            # se gli tolgono l'op, lo richiede
  channels: []             # vuoto = tutti i canali

# -----------------------------------------------------------------------------
# Ban: registro persistente (stesso database della memoria), ban a tempo,
# ripristino dei ban tolti a mano e sincronizzazione con il server all'ingresso.
# Il bot deve essere op (o halfop) nel canale.
# -----------------------------------------------------------------------------
bans:
  enabled: true
  # Che maschera usare quando si banna un nick:
  #   host     -> *!*@host            (default: non rientra cambiando nick)
  #   userhost -> *!*ident@host       (utile per host condivisi, es. bouncer)
  #   nick     -> nick!*@*
  #   full     -> nick!user@host
  # oppure un modello, es. "*!*@{host}" (variabili {nick} {user} {ident} {host})
  mask: host
  enforce: true            # se un op toglie a mano un ban del bot, il bot lo rimette;
                           # chi rientra pur essendo nel registro viene espulso.
                           # Per togliere un ban usa !unban.
  track_manual: true       # registra anche i ban messi a mano (/mode +b) dagli op
  check_interval: 30       # secondi fra un controllo delle scadenze e l'altro
  default_duration: ""     # vuoto = i ban senza durata sono permanenti
  max_duration: ""         # es. "30d" per vietare ban più lunghi (e quelli permanenti)
  list_max: 10             # righe massime di !banlist
  immune:                  # immuni in TUTTI i canali (gli admin del bot lo sono sempre)
    - "*!*@*.staff.example.org"
  unban_immune: true       # toglie i ban messi da altri che colpiscono un immune
  # Tutti i testi sono personalizzabili (elenco completo delle chiavi nel README).
  texts:
    kick_reason_temp: "{reason} (bannato per {duration})"

# -----------------------------------------------------------------------------
# Memoria: il bot ricorda chi passa (per "seen" e "chi è passato") e conserva
# i messaggi lasciati per gli utenti. Usa un database SQLite; se il percorso è
# relativo, è relativo alla cartella di questo file.
# -----------------------------------------------------------------------------
memory:
  enabled: true
  # Qui stanno karma, ban, chi è passato, messaggi lasciati e lo stato delle attività
  # programmate: resta tutto fra un avvio e l'altro. Relativo alla cartella di questo
  # file; usa un percorso assoluto (es. ~/.local/share/linuxbot/linuxbot.db) se preferisci.
  database: linuxbot.db
  retention_days: 365          # dopo quanto dimenticare chi non si è più visto
  store_messages: false        # true = "seen" riporta anche l'ultima frase scritta
  default_days: 7              # per "chi è passato" senza numero di giorni
  max_names: 25                # nick elencati al massimo, poi "e altri N"
  memos:
    deliver_on_join: true      # consegna quando il destinatario entra in canale
    deliver_on_message: true   # ...e anche quando scrive qualcosa (se era già dentro)
    method: private            # private (query) | notice | say (nel canale)
    delay: 3                   # secondi dopo l'ingresso (dopo il saluto)
    max_length: 300
    max_pending: 10            # messaggi in attesa al massimo per destinatario
    expire_days: 60            # i messaggi non consegnati scadono
  # Tutti i testi sono personalizzabili; questi sono alcuni esempi, l'elenco
  # completo delle chiavi è nel README. Variabili: {who} {where} {what} {ago}
  # {when} {period} {count} {names} {recipient} {sender} {text} {max}.
  texts:
    seen: "{who} è passato {ago} ({when}) in {where}, {what}."
    memo_delivered: "📬 {recipient}, {sender} ti ha lasciato un messaggio {ago}: {text}"

# -----------------------------------------------------------------------------
# Log tecnici (per debug e ottimizzazione) e log delle chat.
# Si ricaricano con !reload / SIGHUP senza riavviare il bot.
# -----------------------------------------------------------------------------
logging:
  level: INFO                  # livello generale: DEBUG | INFO | WARNING | ERROR
  console: true                # scrive anche a video (con systemd finisce nel journal)
  format: text                 # text | json (una riga JSON per evento, per Loki/ELK/jq)
  file:
    path: logs/linuxbot.log    # relativo alla cartella di questo file
    rotate: size               # size | daily | none
    max_bytes: 10MB            # con rotate: size
    backups: 7                 # quanti file vecchi tenere
  # Livello per area, per fare debug mirato senza riempire il log. Aree:
  #   connection irc auth channels commands greetings memory bans op events config stats
  # "irc: DEBUG" mostra il traffico IRC grezzo (password nascoste).
  levels:
    irc: WARNING
    # bans: DEBUG
  # Testo da nascondere nei log (regex). Le password della configurazione sono
  # già nascoste automaticamente ovunque compaiano. Con un gruppo () si nasconde
  # solo quello.
  redact:
    - 'token=(\w+)'
  slow_threshold: 0.5          # secondi: righe o azioni più lente generano un avviso
  slow_db_threshold: 0.05      # secondi: operazioni sul database più lente generano un avviso
  # Avvisi su IRC agli admin per i problemi gravi (con limiti anti-spam).
  alerts:
    enabled: true
    level: ERROR               # WARNING per ricevere anche gli avvisi
    to: ["#linux-staff"]       # canali e/o nick
    method: notice             # notice | say
    min_interval: 300          # lo stesso messaggio al massimo ogni 5 minuti
    max_per_hour: 20
  # Log delle conversazioni: logs/chat/<canale>/AAAA-MM-GG.log
  chatlog:
    enabled: false
    directory: logs/chat
    channels: []               # vuoto = tutti
    private: false             # anche i messaggi privati (in logs/chat/_privati)
    retention_days: 90         # 0 = per sempre

# -----------------------------------------------------------------------------
# Saluti agli utenti che entrano.
# -----------------------------------------------------------------------------
greetings:
  enabled: true
  channels: ["#linux"]               # vuoto = tutti i canali
  delay: 2                           # secondi di attesa (se esce prima, niente saluto)
  cooldown: 3600                     # non risalutare la stessa persona per un'ora
  method: say                        # say = nel canale, notice = in privato
  # Il nick viene scritto così com'è: i client IRC lo evidenziano già, non serve la "@".
  # Se preferisci lo stile "@nick" basta scrivere "@{nick}" nel testo.
  # (La "@" davanti al nick nella lista utenti indica invece un operatore: la dà
  #  l'azione "op", qui sotto usata solo nella regola per gli host fidati.)
  messages:
    - "Ciao {nick}, benvenuto su {channel}! Scrivi {prefix}help per vedere cosa so fare."
    - "Benvenuto {nick}! Siamo in {users} su {channel}. Le regole: {rules_url}"
    - "Ehi {nick}, che distro usi oggi? :)"
  actions: []                        # azioni eseguite dopo ogni saluto
  # Regole per maschera: la prima con "messages" sostituisce i messaggi di default,
  # le azioni di tutte le regole che corrispondono vengono eseguite.
  rules:
    - match: "*!*@the-linux-nerd.example.org"
      messages: ["Bentornato capo {nick}!"]
      actions:
        - op: "{nick}"
    - match: ["*!*@*.trusted.example", "*!*@unaffiliated/*"]
      actions:
        - voice: "{nick}"
    - match: "*!*@*.irccloud.com"
      method: notice
    - match: "ChanServ!*@*"
      skip: true                     # non salutare

# -----------------------------------------------------------------------------
# Risposte automatiche a ciò che viene scritto in canale.
#   match: contains | word | exact | startswith | regex
#   addressed: true  -> risponde solo se il messaggio cita il bot (o è in privato)
#   stop: true       -> dopo questa risposta non controllare le successive
# -----------------------------------------------------------------------------
responses:
  - name: saluto
    match: word
    patterns: ["ciao", "salve", "buongiorno", "buonasera"]
    addressed: true
    reply:
      - "Ciao {nick}!"
      - "Ehilà {nick}, come va?"
    cooldown: 60

  - name: distro-consigliata
    description: "quale distro scegliere"
    match: regex
    patterns: ['(che|quale) distro (mi )?consigli']
    reply: "{nick}: per iniziare Linux Mint, Fedora o Debian vanno benissimo. Dipende da cosa ti serve!"
    cooldown: 120

  # --- il bot spiega sé stesso (vedi la sezione "about") -----------------------
  - name: chi-sei
    match: regex
    patterns: ['chi sei', 'cosa sai fare', 'come funzioni', 'che bot sei', 'presentati', 'a cosa servi']
    addressed: true
    cooldown: 10
    actions:
      - explain: ""

  - name: aiuto
    match: regex
    # "TheLinuxBot: aiuto", "TheLinuxBot help!", o "help" scritto in privato al bot
    patterns: ['^(aiuto|help|aiutami|sos)\W*$']
    addressed: true
    cooldown: 10
    actions:
      - explain: ""

  - name: spiegami
    match: regex
    # "TheLinuxBot: come si usa seen?", "TheLinuxBot, spiegami i ban a tempo"
    patterns: ['^(spiegami|come si usa(no)?|come funziona(no)?|a cosa serv(e|ono)) (?P<cosa>.+?)\??$']
    addressed: true
    cooldown: 5
    actions:
      - explain: "{cosa}"

  - name: come-si-usa-comando
    match: regex
    # anche senza citare il bot, se si nomina un comando: "come si usa !tempban?"
    patterns: ['come (si usa|funziona) (?P<cmd>[!.]\w+)']
    cooldown: 30
    actions:
      - explain: "{cmd}"

  - name: pastebin
    description: "dove incollare log ed errori lunghi"
    match: regex
    patterns: ['(?P<cosa>log|errore|output) (lungo|enorme)']
    reply: "{nick}: per {cosa} lunghi usa un pastebin, ad esempio {pastebin}"
    cooldown: 300

  - name: grazie
    match: word
    patterns: ["grazie", "thanks"]
    addressed: true
    reply: ["Prego {nick}!", "Figurati!", "Di niente :)"]

  # "grazie mario!" dà un punto karma a mario (stesse regole di mario++:
  # deve essere nel canale, niente auto-karma, cooldown e limite giornaliero).
  - name: grazie-karma
    match: regex
    patterns: ['^(grazie|grazie mille|thx|thanks|ty)[,:]?\s+(?P<chi>[^\s,.!?:]+)']
    cooldown: 0
    actions:
      - karma_change: { nick: "{chi}", delta: 1 }

  # --- ricerca di risposte tecniche (vedi la sezione "search") ---------------
  - name: domanda-tecnica
    match: regex
    # "TheLinuxBot: come faccio a montare un disco usb?", "TheLinuxBot, how do I resize a partition"
    patterns: ['^(come (faccio|posso|si fa) (a |ad |per )?|how (do i|to|can i) )(?P<q>.+?)\??$']
    addressed: true
    cooldown: 20
    actions:
      - search: "{q}"

  - name: cerca-video
    match: regex
    # "c'è un video su btrfs?", "TheLinuxBot, hai un video che spiega i permessi?"
    patterns: ['(c.è|ci sono|hai|avete|esiste) (un |dei |qualche )?video (su|sul|sulla|sui|sugli|per|che spiega(no)?|di) (?P<q>.+?)\??$']
    cooldown: 20
    actions:
      - search: { query: "{q}", providers: [youtube] }

  - name: ricerca-rapida
    match: regex
    # "?? rsync escludere cartelle" anche senza citare il bot
    patterns: ['^\?\?\s*(?P<q>\S.+)$']
    cooldown: 20
    actions:
      - search: "{q}"

  # --- memoria: domande in linguaggio naturale --------------------------------
  - name: chi-e-passato
    match: regex
    patterns: ['chi (è|e'') passato (negli|in questi) ultimi (?P<giorni>\d+) giorni']
    cooldown: 10
    actions:
      - recent: { days: "{giorni}" }

  - name: chi-e-passato-oggi
    match: regex
    patterns: ['chi (è|e'') passato (oggi|nelle ultime 24 ore)']
    cooldown: 10
    actions:
      - recent: { hours: 24 }

  - name: quando-e-passato
    match: regex
    patterns: ['quando (è|e'') passato (?P<chi>[^\s?]+)']
    cooldown: 5
    actions:
      - seen: "{chi}"

  - name: messaggi-per-me
    match: regex
    patterns: ['ci sono (dei )?messaggi per me', 'ho (dei )?messaggi']
    cooldown: 0
    actions:
      - memo_read

  - name: lascia-messaggio
    match: regex
    # "TheLinuxBot: lascia un messaggio a mario: ricordati la riunione"
    patterns: ['^(lascia|di|dì) (un messaggio )?a (?P<chi>[^\s:,]+)[:,]?\s+(?P<testo>.+)$']
    addressed: true
    cooldown: 0
    actions:
      - memo_add: { to: "{chi}", text: "{testo}" }

  - name: insulto
    match: word
    patterns: ["windows fa schifo"]
    probability: 0.5                 # risponde solo una volta su due
    actions:
      - me: "annuisce in silenzio"

# -----------------------------------------------------------------------------
# Comandi. Chiave = nome del comando.
#   permission: anyone | voice | halfop | op | admin
#   reply: testo (o lista) inviato prima delle azioni
#   method: say | notice   (come inviare "reply")
#   private: false  -> non utilizzabile in query privata
#   Forma breve:  nomecomando: "testo di risposta"
# -----------------------------------------------------------------------------
commands:
  info:
    aliases: [spiega, about]
    description: "Ti spiego chi sono, cosa so fare o come si usa un comando"
    usage: "[comando|argomento]"
    examples: ["{prefix}info", "{prefix}info seen", "{prefix}info moderazione"]
    actions:
      - explain: "{args}"

  help:
    aliases: [aiuto, comandi]
    description: "Elenca i comandi che puoi usare, o spiega come si usa un comando"
    usage: "[comando|argomento]"
    examples: ["{prefix}help", "{prefix}help seen", "{prefix}help moderazione"]
    actions:
      - help: notice                 # notice (default) oppure say

  regole:
    aliases: [rules]
    description: "Le regole del canale"
    reply: "Le regole di {channel} sono qui: {rules_url}"
    cooldown: 30

  sito: "Il nostro sito: {site}"

  ora:
    description: "Data e ora del bot"
    reply: "Sono le {time} di {weekday} {date}."

  ping:
    description: "Verifica che il bot sia vivo"
    reply: ["pong!", "pong, {nick}!"]

  man:
    description: "Link alla pagina man di un comando"
    usage: "<comando>"
    examples: ["{prefix}man ls", "{prefix}man grep"]
    min_args: 1
    reply: "{nick}: https://man7.org/linux/man-pages/man1/{arg1}.1.html"

  saluta:
    description: "Fa salutare qualcuno dal bot"
    usage: "[nick]"
    reply: "Ciao {target}, {nick} ti saluta!"

  abbraccia:
    description: "Abbraccia qualcuno"
    usage: "<nick>"
    min_args: 1
    actions:
      - me: "abbraccia forte {arg1}"

  # --- link rapidi -------------------------------------------------------------
  # {args|url} codifica il testo per un link di ricerca (spazi, &, ...);
  # args_pattern rifiuta argomenti nel formato sbagliato e mostra "Uso: ...".
  archwiki:
    aliases: [aw, wiki]
    description: "Cerca sull'ArchWiki (utile per qualsiasi distro)"
    usage: "<argomento>"
    min_args: 1
    examples: ["{prefix}archwiki network manager", "{prefix}aw systemd-boot"]
    reply: "{nick}: https://wiki.archlinux.org/index.php?search={args|url}"

  pkg:
    aliases: [pacchetto]
    description: "Cerca un pacchetto su Debian, Arch e Fedora"
    usage: "<nome>"
    min_args: 1
    args_pattern: '^[A-Za-z0-9.+_-]+$'
    examples: ["{prefix}pkg htop"]
    reply: "{arg1}: Debian https://packages.debian.org/search?keywords={arg1|url} · Arch https://archlinux.org/packages/?q={arg1|url} · Fedora https://packages.fedoraproject.org/search?query={arg1|url}"

  tldr:
    description: "Esempi pratici di un comando (tldr-pages)"
    usage: "<comando>"
    min_args: 1
    args_pattern: '^[A-Za-z0-9._+-]+$'
    examples: ["{prefix}tldr tar"]
    reply: "{nick}: https://tldr.inbrowser.app/pages/common/{arg1|lower}"

  explainshell:
    aliases: [es]
    description: "Spiega una riga di shell pezzo per pezzo"
    usage: "<riga di comando>"
    min_args: 1
    examples: ["{prefix}es tar -xzvf archivio.tar.gz", "{prefix}es find . -name '*.log' -mtime +7 -delete"]
    reply: "{nick}: https://explainshell.com/explain?cmd={args|url}"

  cve:
    description: "Scheda di una vulnerabilità sul database NVD"
    usage: "<CVE-AAAA-NNNN>"
    min_args: 1
    args_pattern: '(?i)^cve-\d{4}-\d{4,}$'
    examples: ["{prefix}cve CVE-2024-3094"]
    reply: "{arg1|upper}: https://nvd.nist.gov/vuln/detail/{arg1|upper}"

  rfc:
    description: "Link a una RFC"
    usage: "<numero>"
    min_args: 1
    args_pattern: '^\d{1,5}$'
    examples: ["{prefix}rfc 1149"]
    reply: "RFC {arg1}: https://www.rfc-editor.org/rfc/rfc{arg1}"

  xkcd:
    description: "Link a una striscia di xkcd (senza numero: l'ultima)"
    usage: "[numero]"
    args_pattern: '^(\d{1,5})?$'
    examples: ["{prefix}xkcd 1168"]
    reply: "https://xkcd.com/{arg1}"

  kernel:
    description: "Versioni attuali del kernel Linux"
    reply: "Mainline, stable e longterm: https://www.kernel.org/ · changelog leggibile: https://kernelnewbies.org/LinuxVersions"

  distro:
    aliases: [dw]
    description: "Scheda di una distribuzione su DistroWatch"
    usage: "<distro>"
    min_args: 1
    args_pattern: '^[A-Za-z0-9-]+$'
    examples: ["{prefix}distro debian"]
    reply: "{nick}: https://distrowatch.com/table.php?distribution={arg1|lower}"

  web:
    aliases: [ddg]
    description: "Link a una ricerca web (DuckDuckGo)"
    usage: "<testo>"
    min_args: 1
    reply: "{nick}: https://duckduckgo.com/?q={args|url}"

  # --- ricerca di risposte tecniche --------------------------------------------
  cerca:
    aliases: [so, search, stackoverflow]
    description: "Cerca risposte su Stack Overflow, unix.SE, Ask Ubuntu, ArchWiki e video YouTube"
    usage: "<domanda>"
    min_args: 1
    cooldown: 15
    details:
      - "Mostro i 3 risultati più pertinenti, uno per fonte, con voti e risposte. ✔ = risposta accettata."
      - "Puoi anche scrivere \"?? domanda\" o chiedermi \"{botnick}: come faccio a ...?\". In inglese si trova di più."
    examples: ["{prefix}cerca rsync escludere una cartella", "?? bash loop over files with spaces"]
    actions:
      - search: "{args}"

  video:
    aliases: [yt, youtube]
    description: "Cerca un video sui canali YouTube tecnici configurati"
    usage: "<argomento>"
    min_args: 1
    cooldown: 15
    examples: ["{prefix}video installare arch linux", "{prefix}yt bash script"]
    actions:
      - search: { query: "{args}", providers: [youtube] }

  unix:
    aliases: [use]
    description: "Cerca solo su unix.stackexchange.com"
    usage: "<domanda>"
    min_args: 1
    cooldown: 15
    actions:
      - search: { query: "{args}", providers: [unix] }

  # --- karma ---------------------------------------------------------------------
  karma:
    description: "Punti karma di un utente (o i tuoi); \"{prefix}karma top\" per la classifica"
    usage: "[nick]"
    details:
      - "Per dare un punto a chi ti ha aiutato scrivi nick++ (o \"grazie nick\"); nick-- per toglierlo."
      - "Il karma non si dà da soli, una volta all'ora per persona, al massimo 20 punti al giorno. Un ban lo azzera."
    examples: ["{prefix}karma", "{prefix}karma mario", "mario++"]
    actions:
      - karma_show: "{target}"

  top:
    aliases: [classifica]
    description: "Classifica del karma del canale"
    actions:
      - karma_top

  karmareset:
    description: "Azzera il karma di un utente"
    usage: "<nick>"
    permission: op
    min_args: 1
    private: false
    actions:
      - karma_reset: "{arg1}"

  backup:
    description: "Copia di sicurezza del database adesso"
    permission: admin
    actions:
      - db_backup: { directory: backups, keep: 14 }

  esegui:
    description: "Esegue subito un'attività programmata (per provarla)"
    usage: "<nome attività>"
    permission: admin
    min_args: 1
    examples: ["{prefix}esegui karma-mezzanotte"]
    actions:
      - schedule_run: "{arg1}"

  # --- memoria -----------------------------------------------------------------
  seen:
    aliases: [visto]
    description: "Quando è stato visto l'ultima volta un utente"
    usage: "<nick>"
    details:
      - "Ti dico quando ho visto quell'utente l'ultima volta, dove e cosa stava facendo (entrava, usciva, scriveva...)."
      - "Puoi anche chiedermelo a parole: \"quando è passato mario?\""
    examples: ["{prefix}seen mario"]
    actions:
      - seen: "{arg1}"

  passati:
    aliases: [recenti, recent]
    description: "Chi è passato negli ultimi N giorni (default 7)"
    usage: "[giorni]"
    examples: ["{prefix}passati", "{prefix}passati 3", "chi è passato negli ultimi 3 giorni?"]
    cooldown: 10
    actions:
      - recent: "{arg1}"

  lascia:
    aliases: [tell, memo]
    description: "Lascia un messaggio a un utente, glielo riferirò appena lo vedo"
    usage: "<nick> <messaggio>"
    details:
      - "Glielo consegno in privato quando entra, quando scrive qualcosa o quando chiede \"ci sono messaggi per me?\" (o {prefix}messaggi)."
      - "I messaggi vanno al nick: chiunque usi quel nick li riceve. Dopo 60 giorni scadono."
    examples: ["{prefix}lascia mario ricordati la riunione", "{botnick}: lascia un messaggio a mario: ciao!"]
    min_args: 2
    actions:
      - memo_add: { to: "{arg1}", text: "{rest}" }

  messaggi:
    description: "Ti consegna i messaggi che ti hanno lasciato"
    actions:
      - memo_read

  # --- comandi di moderazione ------------------------------------------------
  kick:
    description: "Espelle un utente"
    usage: "<nick> [motivo]"
    permission: op
    min_args: 1
    private: false
    actions:
      - kick:
          nick: "{arg1}"
          reason: "{rest}"

  ban:
    description: "Banna ed espelle un utente (nick o maschera)"
    usage: "<nick|maschera> [motivo]"
    permission: op
    min_args: 1
    private: false
    actions:
      - kickban: { nick: "{arg1}", reason: "{rest}", confirm: true }

  tempban:
    aliases: [tb]
    description: "Ban a tempo: si toglie da solo alla scadenza (30m, 2h, 1d, 1w, 1d12h)"
    usage: "<nick|maschera> <durata> [motivo]"
    details:
      - "Durate: m minuti, h ore, d giorni, w settimane, combinabili (1d12h). Un numero da solo sono minuti."
      - "Il ban resta salvato anche se riavvio, e lo tolgo io alla scadenza."
    examples: ["{prefix}tempban mario 2h flood", "{prefix}tempban *!*@*.spam.example 1d"]
    permission: op
    min_args: 2
    private: false
    actions:
      - kickban: { nick: "{arg1}", duration: "{arg2}", reason: "{rest2}", confirm: true }

  unban:
    description: "Rimuove un ban: per nick (anche se è uscito), maschera o #numero"
    usage: "<nick|maschera|#id>"
    permission: op
    min_args: 1
    actions:
      - unban: "{arg1}"

  banlist:
    aliases: [bans]
    description: "Elenca i ban attivi (in privato indica il canale)"
    usage: "[#canale]"
    permission: op
    actions:
      - banlist

  baninfo:
    description: "Chi ha bannato, quando, perché e quando scade"
    usage: "<nick|maschera|#id>"
    permission: op
    min_args: 1
    actions:
      - baninfo: "{arg1}"

  op:
    description: "Dà op (a te o a un altro utente)"
    usage: "[nick]"
    permission: op
    private: false
    actions:
      - op: "{target}"

  voice:
    description: "Dà voice"
    usage: "[nick]"
    permission: op
    private: false
    actions:
      - voice: "{target}"

  topic:
    description: "Cambia il topic"
    usage: "<testo>"
    permission: op
    min_args: 1
    private: false
    actions:
      - topic: "{args}"

  annuncio:
    description: "Annuncio in tutti i canali principali"
    usage: "<testo>"
    permission: admin
    min_args: 1
    actions:
      - say: { to: "#linux", text: "📢 {args}" }
      - delay: 1
      - say: { to: "#linux-staff", text: "Annuncio inviato da {nick}: {args}" }

  # --- amministrazione del bot -------------------------------------------------
  stats:
    description: "Statistiche: attività, comandi, tempi, anti-flood, database, errori"
    usage: "[generale|comandi|flood|db|errori]"
    permission: admin
    actions:
      - stats

  entra:
    description: "Fa entrare il bot in un canale"
    usage: "<#canale> [chiave]"
    permission: admin
    min_args: 1
    actions:
      - join: "{args}"

  esci:
    description: "Fa uscire il bot dal canale"
    usage: "[#canale]"
    permission: admin
    actions:
      - part: { channel: "{arg1}", reason: "Ordine di {nick}" }

  dici:
    description: "Fa parlare il bot in un canale"
    usage: "<#canale> <testo>"
    permission: admin
    min_args: 2
    actions:
      - say: { to: "{arg1}", text: "{rest}" }

  raw:
    description: "Invia una riga IRC grezza"
    usage: "<riga>"
    permission: admin
    min_args: 1
    hidden: true
    actions:
      - raw: "{args}"

  reload:
    description: "Ricarica config.yaml senza riavviare"
    permission: admin
    actions:
      - reload:
          ok: "Configurazione ricaricata, {nick}."
          error: "Errore: {error}"

  quit:
    description: "Spegne il bot"
    permission: admin
    hidden: true
    actions:
      - quit: "Spento da {nick}"

# -----------------------------------------------------------------------------
# Azioni legate agli eventi IRC.
#   connect    dopo la registrazione al server
#   identified quando i services confermano l'identificazione
#   self_join  quando il bot entra in un canale
#   self_op / self_deop  quando il bot riceve / perde l'op ({nick} = chi l'ha fatto)
#   join/part/quit/nick/kick/topic/invite  quando lo fanno gli altri
#   self_kick  quando il bot viene espulso
# Variabili extra: {reason}, {victim}, {kicker}, {old_nick}, {new_nick}, {topic}
# -----------------------------------------------------------------------------
events:
  # Avvisa lo staff se qualcuno toglie l'op al bot (che lo richiede da solo).
  self_deop:
    - say: { to: "#linux-staff", text: "{nick} mi ha tolto l'op in {channel}, lo richiedo a ChanServ." }

  invite:
    # Decommenta per accettare gli inviti in altri canali.
    # - join: "{channel}"

  self_kick:
    - say: { to: "#linux-staff", text: "Sono stato espulso da {channel} da {kicker}: {reason}" }
